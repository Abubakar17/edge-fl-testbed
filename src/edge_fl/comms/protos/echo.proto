// Phase 1 benchmark service. Three ways to move a payload between two nodes:
//   Echo     payload goes to the server and comes back   (round trip)
//   Upload   payload goes client -> server, tiny receipt back   (FL: client sends its update)
//   Download tiny request, payload comes server -> client       (FL: client receives the model)
// The server does no work on the data, so timings measure transport only.
//
// Regenerate the Python code after editing this file:  make protos

syntax = "proto3";

package edge_fl.comms;

// A payload in either direction.
message Payload {
  bytes data = 1;   // the bytes being moved; its size is what the benchmark varies
  uint64 seq = 2;   // request number, so the client can check the reply matches
}

// Upload receipt: proves the server got all the bytes, without sending them back.
message Ack {
  uint64 seq = 1;
  uint64 received_bytes = 2;
}

// Download request: "send me size_bytes bytes".
message SizeRequest {
  uint64 seq = 1;
  uint64 size_bytes = 2;
}

service Echo {
  rpc Echo(Payload) returns (Payload);
  rpc Upload(Payload) returns (Ack);
  rpc Download(SizeRequest) returns (Payload);
}
