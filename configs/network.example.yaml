# Network setup and (optional) emulated link conditions.
# Copy and edit per experiment; values are placeholders until the hardware is confirmed.

topology: star              # star (server-client) | ring | complete | custom
subnet: 192.168.50.0/24     # testbed switch (TP-Link 16-port, unmanaged gigabit)
link:
  nominal_bandwidth_mbps: 1000   # switch; N2L USB 2.0 adapters cap at ~250-320
  # Optional shaping with tc/netem on the boards (null = no shaping)
  emulate:
    delay_ms: null
    jitter_ms: null
    loss_pct: null
    rate_mbps: null
grpc:
  max_message_mb: 64
  compression: none         # none | gzip
