# Phase 1: gRPC communication benchmarks
base: configs/experiment.example.yaml

benchmarks:
  - ping_pong          # round-trip latency
  - throughput         # sustained bandwidth
  - payload_cost       # serialization + transfer cost vs. payload size
payload_sizes_kb: [1, 10, 100, 1000, 10000]
concurrent_clients: [1, 2, 3]
messages_per_run: 1000
warmup_messages: 50
